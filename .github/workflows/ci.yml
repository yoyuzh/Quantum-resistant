name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to test for desktop delivery
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-22.04
            python: '3.13'
          - os: windows-2022
            python: '3.13'
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      # CI runs Node tests, without launching or packaging Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python dependencies
        run: python -m pip check

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Test web
        run: npm --prefix web test

      - name: Test desktop
        run: npm --prefix desktop test

      # Backend tests read these assets; always test the freshly built UI.
      - name: Build web
        run: npm --prefix web run build

      - name: Test Python
        run: python -B -m unittest discover -s tests -v

      - name: Smoke test the running web application
        run: python -B scripts/ci_smoke.py
