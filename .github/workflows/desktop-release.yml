name: Desktop Release

on:
  push:
    tags: ['v*', 'desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z or legacy desktop-vX.Y.Z tag containing the release workflows
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  # Do not interrupt an upload or publication already in progress.
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag and version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      sha: ${{ steps.identity.outputs.sha }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate tag, package versions and commit
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python -B scripts/desktop_release.py prepare

  checks:
    name: Release CI
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    name: Build (${{ matrix.target }})
    needs: [prepare, checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            desktop/requirements-build.txt
            desktop/requirements-runtime.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install desktop tooling
        run: npm ci --prefix desktop

      # Existing script builds UI, tests Node code, freezes and smoke-tests
      # the backend, then packages with --publish never and writes checksums.
      - name: Build and smoke test installer resources
        run: npm --prefix desktop run build

      - name: Test locked build runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime=desktop/.venv-build/bin/python
          if [ "$RUNNER_OS" = Windows ]; then
            runtime=desktop/.venv-build/Scripts/python.exe
          fi
          "$runtime" -m pip install hypothesis
          "$runtime" -m pip check
          "$runtime" -B -m unittest discover -s tests -v

      - name: Verify identity and checksums, generate release notes
        run: python -B scripts/desktop_release.py verify

      - name: Store verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-${{ matrix.target }}-${{ needs.prepare.outputs.sha }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.deb
            desktop/release/SHA256SUMS.txt
            desktop/release/BUILD-INFO.json
            desktop/release/RELEASE-NOTES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      # The job with write permission does not checkout or execute repository code.
      - name: Download verified assets from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-release-*-${{ needs.prepare.outputs.sha }}
          path: release

      - name: Publish all native packages for the tested tag
        shell: bash
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "Release tag moved after CI; publication stopped." >&2
            exit 1
          fi
          packages=()
          : > release/SHA256SUMS.txt
          for target in windows-x64 linux-x64 macos-x64 macos-arm64; do
            case "$target" in
              windows-x64) suffix=win-x64.exe ;;
              linux-x64) suffix=linux-amd64.deb ;;
              macos-x64) suffix=mac-x64.dmg ;;
              macos-arm64) suffix=mac-arm64.dmg ;;
            esac
            installer=Quantum-Scanner-$RELEASE_VERSION-$suffix
            folder=release/desktop-release-$target-$RELEASE_SHA
            (cd "$folder" && sha256sum --check --strict SHA256SUMS.txt)
            digest=$(sha256sum "$folder/$installer" | cut -d' ' -f1)
            jq -e --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" \
              --arg version "$RELEASE_VERSION" --arg target "$target" \
              --arg installer "$installer" --arg digest "$digest" '
              .sha == $sha and .tag == $tag and .version == $version and
              .target == $target and .installer == $installer and .sha256 == $digest
            ' "$folder/BUILD-INFO.json"
            cp "$folder/$installer" "release/$installer"
            cat "$folder/SHA256SUMS.txt" >> release/SHA256SUMS.txt
            packages+=("$installer")
          done
          cd release
          sha256sum --check --strict SHA256SUMS.txt
          jq -s '{tag: .[0].tag, version: .[0].version, sha: .[0].sha,
            prerelease: .[0].prerelease, signed: false, builds: .}' desktop-release-*/BUILD-INFO.json > BUILD-INFO.json
          cat > RELEASE-NOTES.md <<EOF
          抗量子密码风险检测与迁移辅助软件 V$RELEASE_VERSION

          - Windows x64：EXE 安装程序
          - Linux x64：Ubuntu DEB 安装包
          - macOS Intel：x64 DMG
          - macOS Apple Silicon：arm64 DMG

          源码提交：${RELEASE_SHA}。
          四个平台均原生构建，通过锁定运行依赖回归及冻结后端冒烟检查。
          SHA256SUMS.txt 覆盖全部安装包，BUILD-INFO.json 记录各平台构建身份。
          安装包尚未正式代码签名，macOS 尚未 Apple 公证。自动检查不代表安装后 GUI 实机验收。
          EOF
          if [ "$RELEASE_PRERELEASE" = true ]; then
            publish_flags=(--prerelease --latest=false)
          elif [ "$RELEASE_PRERELEASE" = false ]; then
            publish_flags=(--prerelease=false --latest=true)
          else
            echo "Invalid release channel; publication stopped." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${packages[@]}" SHA256SUMS.txt BUILD-INFO.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false \
            --title "抗量子密码风险检测与迁移辅助软件 $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false "${publish_flags[@]}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > published-release.json
          expected=$(printf '%s\n' "${packages[@]}" SHA256SUMS.txt BUILD-INFO.json | jq -Rn '[inputs]')
          jq -e --arg tag "$RELEASE_TAG" --argjson expected "$expected" \
            --argjson prerelease "$RELEASE_PRERELEASE" '
            (.assets | map(select(.size > 0) | .name)) as $actual |
            .tag_name == $tag and .draft == false and .prerelease == $prerelease and
            all($expected[]; . as $name | $actual | index($name) != null)
          ' published-release.json
          if [ "$RELEASE_PRERELEASE" = false ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name | grep -Fx "$RELEASE_TAG"
          fi
